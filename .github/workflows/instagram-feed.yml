name: Update Instagram feed

on:
  schedule:
    - cron: "17 10 * * *"   # daily, ~5-6 AM Eastern
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch posts and rebuild feed
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_POST_COUNT: "6"
          IG_USER_ID: "17841457933615990"   # @emmystrongnj's Instagram account ID (not secret)
        run: python .github/scripts/update_instagram.py

      - name: Commit changes
        id: commit
        run: |
          git add -A index.html media/instagram
          if git diff --cached --quiet; then
            echo "No new posts."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Instagram feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't always trigger a Pages build, so request one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
