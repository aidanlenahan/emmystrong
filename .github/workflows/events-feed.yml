name: Update events

on:
  schedule:
    - cron: "43 * * * *"     # every hour
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: site-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read calendar and rebuild events
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          EVENT_COUNT: "6"
          PAST_COUNT: "30"
        run: python .github/scripts/update_events.py

      - name: Commit changes
        id: commit
        run: |
          git add -A events.html past-events.html events.ics
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update events"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't always trigger a Pages build, so request one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
